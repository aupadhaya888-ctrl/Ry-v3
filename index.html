<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAYYOKA V3</title><link rel="stylesheet" href="style.css"></head><body><header><div><h1>RAYYOKA V3</h1><p>Business Management System</p></div><button id="export">Export Excel</button></header><main><section class="cards"><article><span>Total Revenue</span><strong id="revenue">NPR 0</strong></article><article><span>Today's Sale</span><strong id="today">NPR 0</strong></article><article><span>Orders</span><strong id="orders">0</strong></article><article><span>Estimated Profit</span><strong id="profit">NPR 0</strong></article></section><section class="panel"><h2>Business Control</h2><div class="grid"><label>Opening Balance<input id="opening" type="number" min="0" value="0"></label><label>Sale Amount<input id="sale" type="number" min="0" value="0"></label><label>Estimated Cost<input id="cost" type="number" min="0" value="0"></label></div><div class="actions"><button id="open">Open Business</button><button id="add">Record Sale</button><button id="close">Close Business</button></div><p id="status">Business closed</p></section><section class="panel"><h2>Recent Sales</h2><table><thead><tr><th>Time</th><th>Sale</th><th>Cost</th><th>Profit</th></tr></thead><tbody id="sales"></tbody></table></section></main><footer>RAYYOKA V3 • Data stored locally until connected to your V3 Supabase database</footer><script src="app.js"></script></body></html>
